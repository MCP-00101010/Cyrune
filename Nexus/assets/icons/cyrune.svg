<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Cyrune</title>
  <desc id="desc">Three interlocking rounded-square rings forming the Cyrune lattice.</desc>
  <defs>
    <radialGradient id="glow" cx="70%" cy="18%" r="90%">
      <stop offset="0" stop-color="#202842"/>
      <stop offset="0.58" stop-color="#101622"/>
      <stop offset="1" stop-color="#080b12"/>
    </radialGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#glow)" stroke="#2b3446" stroke-width="2"/>
  <circle cx="64" cy="64" r="37" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="18"/>
  <g fill="none" stroke-width="5" stroke-linejoin="round">
    <rect x="34" y="34" width="60" height="60" rx="14" stroke="#9b8cff"/>
    <rect x="34" y="34" width="60" height="60" rx="14" stroke="#6ba9ff" transform="rotate(60 64 64)"/>
    <rect x="34" y="34" width="60" height="60" rx="14" stroke="#e870bd" transform="rotate(120 64 64)"/>
  </g>
  <circle cx="64" cy="64" r="3.5" fill="#eef3fb"/>
</svg>
