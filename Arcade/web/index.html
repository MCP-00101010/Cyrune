<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="cyrune-arcade" content="1">
    <meta name="morpheus-emugui" content="1">
    <title>Cyrune Arcade</title>
    <link rel="icon" type="image/svg+xml" href="assets/arcade.svg">
    <link rel="stylesheet" href="style.css?v=0.2.57">
  </head>
  <body>
    <main class="shell" id="shell">
      <aside class="sidebar" id="sidebar">
        <section class="sidebar-card menu-card">
          <h1>Cyrune Arcade</h1>
          <div class="sidebar-meta-row">
            <span id="library-count">Loading library...</span>
            <button id="arcade-version" class="arcade-version" type="button" title="Settings" aria-label="Open Arcade settings">v0.2.57</button>
          </div>
        </section>
        <section class="sidebar-card platforms-card">
          <h2>Platforms</h2>
          <nav id="platform-grid" class="platform-grid" aria-label="Platforms"></nav>
          <select id="platform-select" aria-label="Platform" hidden></select>
        </section>
        <section class="sidebar-card emulator-shortcuts-card" aria-label="Emulators">
          <h2>Emulators</h2>
          <div id="emulator-shortcuts" class="emulator-shortcuts"></div>
          <p id="emulator-shortcuts-status" class="emulator-shortcuts-status" role="status" hidden></p>
        </section>
        <section class="sidebar-card filters-card" aria-label="Library filters">
          <h2 class="card-title">Filters</h2>
          <label class="search"><span>Search</span><input id="search" type="search" autocomplete="off" placeholder="Search games"></label>
          <label class="select-filter collection-filter"><span>Collection</span><select id="collection-select" aria-label="Collection"></select></label>
        <section class="filter-group">
          <h2 class="section-title-row">View <span class="view-beacons"><span id="incoming-indicator" class="view-indicator incoming-indicator" hidden></span><span id="trash-indicator" class="view-indicator trash-indicator" hidden></span></span></h2>
          <label class="select-filter">
            <span>Show</span>
            <select id="filter-view">
              <option value="all">All Games</option>
              <option value="favourites">Favourites</option>
              <option value="recent">Recent</option>
            </select>
          </label>
          <label class="select-filter"><span>Needs attention</span><select id="filter-cleanup">
            <option value="">Any</option><option value="artwork">Missing artwork</option>
            <option value="description">Missing description</option><option value="review">Needs scrape review</option>
          </select></label>
          <label><input type="checkbox" id="filter-poks"> POKs available</label>
        </section>

        <section class="filter-group">
          <h2>Metadata</h2>
          <label class="select-filter">
            <span>System</span>
            <div id="filter-system" class="filter-combo"></div>
          </label>
          <label class="select-filter">
            <span>Language</span>
            <div id="filter-language" class="filter-combo"></div>
          </label>
          <label class="select-filter">
            <span>Country</span>
            <div id="filter-country" class="filter-combo"></div>
          </label>
          <label class="select-filter">
            <span>Year</span>
            <div id="filter-year" class="filter-combo"></div>
          </label>
          <label class="select-filter">
            <span>Publisher</span>
            <div id="filter-publisher" class="filter-combo"></div>
          </label>
          <label class="select-filter">
            <span>Tag</span>
            <div id="filter-tag" class="filter-combo"></div>
          </label>
        </section>

          <button id="clear-filters" class="secondary clear-filters" type="button">Clear Filters</button>
        </section>
        <select id="emulator" aria-label="Current emulator" hidden></select>
      </aside>

      <section class="content">
        <div class="toolbar">
          <div>
            <strong id="result-count">0 games</strong>
            <span id="active-summary"></span>
          </div>
          <div class="toolbar-actions">
            <span id="selection-count"></span>
            <div id="import-select-tools" class="import-select-tools" hidden>
              <span>Select</span>
              <button class="secondary compact" type="button" data-import-select="new">New</button>
              <button class="secondary compact" type="button" data-import-select="system-match">Duplicates</button>
              <button class="secondary compact" type="button" data-import-select="title-match">Variants</button>
            </div>
            <button id="column-options" class="secondary" type="button">Columns</button>
            <button id="bulk-edit" class="secondary" disabled>Edit Selected</button>

          </div>
        </div>

        <div class="library">
          <table id="game-table">
            <colgroup id="game-colgroup"></colgroup>
            <thead>
              <tr id="game-head-row"></tr>
            </thead>
            <tbody id="game-list"></tbody>
          </table>
        </div>
      </section>

      <aside class="details" id="details">
        <div class="empty-state">Select a game</div>
      </aside>

      <button id="toggle-sidebar" class="edge-toggle edge-toggle-left" type="button" aria-label="Toggle filters panel" title="Toggle filters panel">&lt;</button>
      <button id="toggle-details" class="edge-toggle edge-toggle-right" type="button" aria-label="Toggle details panel" title="Toggle details panel">&gt;</button>
    </main>

    <div id="busy-overlay" class="busy-overlay hidden" aria-live="polite" aria-busy="true">
      <div class="busy-panel">
        <h2 id="busy-title">Working</h2>
        <p id="busy-message">Indexing collection...</p>
        <div class="busy-bar"><span id="busy-progress"></span></div>
      </div>
    </div>

    <script src="../../Nexus/client/component-settings.js"></script>
    <script src="transport.js"></script>
    <script src="portal-theme.js"></script>
    <script src="portal-delivery.js"></script>
    <script src="platforms.js?v=0.2.57"></script>
    <script src="metadata-scraping.js?v=0.2.57"></script>
    <script src="settings-ui.js?v=0.2.57"></script>
    <script src="emulator-shortcuts.js?v=0.2.57"></script>
    <script src="scrape-drafts.js"></script>
    <script src="scrape-views.js"></script>
    <script src="artwork.js"></script>
    <script src="app.js?v=0.2.57"></script>
  </body>
</html>
